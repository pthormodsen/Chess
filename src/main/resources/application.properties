# Path to the stockfish binary (can also be set via env STOCKFISH_PATH)
stockfish.path=${STOCKFISH_PATH:engines/stockfish/stockfish-macos-m1-apple-silicon}
server.port=${SERVER_PORT:8081}

# In-memory game sessions: idle sessions are evicted (and their engine process stopped) after the timeout.
chess.sessions.max=${CHESS_SESSIONS_MAX:500}
chess.sessions.idle-timeout=${CHESS_SESSIONS_IDLE_TIMEOUT:30m}
# Server-wide caps on Stockfish work.
chess.engine.max-sessions=${CHESS_ENGINE_MAX_SESSIONS:8}
chess.analysis.max-concurrent=${CHESS_ANALYSIS_MAX_CONCURRENT:2}
# Reject oversized JSON bodies early (PGN import is the largest legitimate payload).
server.tomcat.max-swallow-size=1MB
